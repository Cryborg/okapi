[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/Cryborg/okapi"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rustix = { version = "1.1.6", features = ["fs", "param", "process"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "std", "registry", "tracing-log"] }
tempfile = "3.27.0"
png = "0.18.1"
# Without the system tray it would bring; the compatibility feature is required.
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-default", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2"] }
# The testing backend follows no semver: the three move together, exactly.
slint-build = "=1.18.1"
i-slint-backend-testing = "=1.18.1"
okapi-rules = { path = "crates/rules" }
okapi-platform = { path = "crates/platform" }
okapi-engine = { path = "crates/engine" }
okapi-store = { path = "crates/store" }
okapi-helper = { path = "crates/helper" }
okapi-tools = { path = "crates/tools" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
allow_attributes_without_reason = "warn"
