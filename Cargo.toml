[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/Cryborg/okapi"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rustix = { version = "1.1.6", features = ["fs", "process"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tempfile = "3.27.0"
okapi-rules = { path = "crates/rules" }
okapi-platform = { path = "crates/platform" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
allow_attributes_without_reason = "warn"
