[package]
name = "okapi-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
blake3 = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
okapi-engine = { workspace = true, optional = true }
okapi-platform = { workspace = true, optional = true }
okapi-rules = { workspace = true, optional = true }
png = { workspace = true, optional = true }
resvg = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

# Never in `okapi-platform`: the privileged helper depends on it, and its
# reviewed crates (`okapi-helper` tests) would grow with the bus.
[target.'cfg(target_os = "linux")'.dependencies]
async-io = { workspace = true, optional = true }
futures-lite = { workspace = true, optional = true }
zbus = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

# A fake flatpak helper on a socket pair, for the tests of its client.
[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { workspace = true, features = ["p2p"] }

[features]
# What the dashboard reads of the system, and the thread that reads it.
monitor = ["dep:okapi-platform", "dep:okapi-rules", "dep:tracing"]
# What takes the space of a folder, read on threads of its own.
disk-usage = ["dep:okapi-platform", "dep:thiserror", "dep:tracing"]
# Copies of one content in the user's folders, read on threads of their own.
duplicates = ["dep:okapi-platform", "dep:okapi-engine", "dep:blake3", "dep:jiff", "dep:thiserror", "dep:tracing"]
# The package managers' daemons, asked and never run: PackageKit and
# flatpak's system helper on the system bus, snapd on its socket.
packages = [
    "dep:async-io",
    "dep:futures-lite",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:tracing",
    "dep:zbus",
]
# What waits for an update, read from those daemons.
updates = ["packages", "dep:jiff", "dep:okapi-rules"]
# The applications installed and their space (deb, snap, flatpak).
apps = [
    "disk-usage",
    "packages",
    "dep:okapi-rules",
    "dep:png",
    "dep:resvg",
    "dep:serde",
    "dep:serde_json",
]

[[example]]
name = "disk_usage"
required-features = ["disk-usage"]

[[example]]
name = "duplicates"
required-features = ["duplicates"]

[[example]]
name = "packages"
required-features = ["packages"]

[lints]
workspace = true
