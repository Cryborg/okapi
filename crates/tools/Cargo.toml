[package]
name = "okapi-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
blake3 = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
okapi-engine = { workspace = true, optional = true }
okapi-platform = { workspace = true, optional = true }
okapi-rules = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# What the dashboard reads of the system, and the thread that reads it.
monitor = ["dep:okapi-platform", "dep:okapi-rules", "dep:tracing"]
# What takes the space of a folder, read on threads of its own.
disk-usage = ["dep:okapi-platform", "dep:thiserror", "dep:tracing"]
# Copies of one content in the user's folders, read on threads of their own.
duplicates = ["dep:okapi-platform", "dep:okapi-engine", "dep:blake3", "dep:jiff", "dep:thiserror", "dep:tracing"]

[[example]]
name = "disk_usage"
required-features = ["disk-usage"]

[[example]]
name = "duplicates"
required-features = ["duplicates"]

[lints]
workspace = true
